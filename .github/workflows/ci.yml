name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy auditor/

      - name: Test with pytest
        run: pytest --cov=auditor --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}

  self-scan:
    name: CredsClaw self-scan (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Self-scan the shipped source for exposed credentials
        # Scoped to the package rather than the whole repo: tests/ holds
        # synthetic keys built from fragments that are syntactically
        # indistinguishable from live ones, so a whole-tree gate would fail on
        # its own fixtures and train everyone to ignore a red build.
        # NOTE: --dry-run must NOT be added here; it short-circuits before
        # scanning, which made this step unfailable before it was a gate.
        run: >-
          python -m auditor
          --mode local
          --dir auditor
          --providers all
          --confidence-threshold 60.0
          --fail-on-findings
          --output-file output/self_scan.json

      - name: Estimate secret exposure in the working tree (informational)
        run: python -m auditor --mode local --dir . --providers all --confidence-threshold 60.0 --dry-run