repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-aiohttp]
        args: [--ignore-missing-imports]
  - repo: local
    hooks:
      - id: credsclaw
        name: CredsClaw
        # Scoped to the shipped package: tests/ holds synthetic key literals
        # that are indistinguishable from live ones, so a whole-tree gate
        # would block on this repo's own fixtures.
        entry: python -m auditor --mode local --dir auditor --confidence-threshold 60.0 --fail-on-findings
        language: system
        types: [text]
        pass_filenames: false
